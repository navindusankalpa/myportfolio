<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Status // Transmission Confirmed</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Space+Mono&display=swap" rel="stylesheet">
    
    <style>
        body {
            background-color: #05070f;
            font-family: 'Lato', sans-serif;
            background-size: 30px 30px;
            background-image: linear-gradient(to right, rgba(91, 76, 255, 0.02) 1px, transparent 1px),
                              linear-gradient(to bottom, rgba(91, 76, 255, 0.02) 1px, transparent 1px);
        }
        .font-mono-tech {
            font-family: "Space Mono", monospace;
        }
        @keyframes cyberGlow {
            0%, 100% { box-shadow: 0 0 20px rgba(91, 76, 255, 0.15), inset 0 0 10px rgba(91, 76, 255, 0.05); }
            50% { box-shadow: 0 0 35px rgba(91, 76, 255, 0.3), inset 0 0 15px rgba(91, 76, 255, 0.1); }
        }
        .cyber-card {
            background: rgba(10, 14, 26, 0.85);
            border: 1px solid rgba(91, 76, 255, 0.3);
            animation: cyberGlow 4s infinite ease-in-out;
            backdrop-filter: blur(12px);
        }
        @keyframes scaleIn {
            0% { transform: scale(0.97); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        .animate-scale-in {
            animation: scaleIn 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        @keyframes pulseLine {
            0% { transform: scaleX(0); opacity: 0; }
            50% { transform: scaleX(1); opacity: 1; }
            100% { transform: scaleX(0); opacity: 0; }
        }
        .cyber-loader-line {
            height: 1px;
            width: 100%;
            background: linear-gradient(90deg, transparent, #5B4CFF, transparent);
            animation: pulseLine 2.5s infinite ease-in-out;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 antialiased text-slate-300">

    <!-- Cyber Card Wrapper -->
    <div class="max-w-md w-full cyber-card rounded-xl p-8 md:p-10 text-center animate-scale-in relative overflow-hidden">
        
        <!-- Tech brackets border detail -->
        <div class="absolute top-0 left-0 w-4 h-4 border-t-2 border-l-2 border-[#5B4CFF]"></div>
        <div class="absolute top-0 right-0 w-4 h-4 border-t-2 border-r-2 border-[#5B4CFF]"></div>
        <div class="absolute bottom-0 left-0 w-4 h-4 border-b-2 border-l-2 border-[#5B4CFF]"></div>
        <div class="absolute bottom-0 right-0 w-4 h-4 border-b-2 border-r-2 border-[#5B4CFF]"></div>

        <!-- Metric Header Details -->
        <div class="flex justify-between items-center font-mono-tech text-[10px] text-indigo-400/60 mb-6 px-1">
            <span>SYS_STATUS: 200_OK</span>
            <span>COMMS_ROUTING: SUCCESS</span>
        </div>
        
        <!-- Cyber Glowing Icon Container -->
        <div class="relative w-20 h-20 mx-auto mb-6 flex items-center justify-center">
            <div class="absolute inset-0 bg-indigo-500/10 rounded-full blur-md"></div>
            <div class="w-full h-full border border-indigo-500/40 rounded-full flex items-center justify-center bg-indigo-950/30 text-[#5B4CFF]">
                <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"></path>
                </svg>
            </div>
        </div>

        <!-- Structural Title -->
        <h1 class="text-2xl font-black text-white mb-2 tracking-wide font-mono-tech text-transparent bg-clip-text bg-gradient-to-r from-white to-slate-400">
            TRANSMISSION_COMPLETE
        </h1>
        
        <div class="cyber-loader-line my-4"></div>
        
        <p class="text-slate-400 text-sm leading-relaxed mb-8 px-2">
            The data packet has been verified and safely committed to my communication queue. I will review your logs and route a response back shortly.
        </p>

        <!-- Cyber Back Button Button -->
        <a href="index.html" class="group relative font-mono-tech text-xs tracking-widest inline-flex items-center justify-center w-full py-4 text-white bg-gradient-to-r from-indigo-600 to-purple-600 rounded border border-indigo-400/30 overflow-hidden transition-all duration-300 hover:from-indigo-500 hover:to-purple-500 shadow-[0_0_20px_rgba(91,76,255,0.25)] active:scale-[0.99] focus:outline-none">
            <i class="fas fa-terminal mr-2 group-hover:-translate-x-1 transition-transform duration-300"></i>
            RETURN_TO_ROOT
        </a>
        
    </div>

</body>
</html>
