<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You | Message Sent</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Lato', sans-serif;
        }
        
        @keyframes scaleIn {
            0% { transform: scale(0.95); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
            100% { transform: translateY(0px); }
        }
        
        @keyframes checkmark {
            0% { stroke-dashoffset: 50; opacity: 0; }
            100% { stroke-dashoffset: 0; opacity: 1; }
        }

        .animate-scale-in {
            animation: scaleIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        
        .animate-float {
            animation: float 3s ease-in-out infinite;
        }

        .checkmark-draw {
            stroke-dasharray: 50;
            stroke-dashoffset: 50;
            animation: checkmark 0.8s cubic-bezier(0.65, 0, 0.45, 1) 0.3s forwards;
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center p-4 antialiased">

    <!-- Card Container -->
    <div class="max-w-md w-full bg-white rounded-2xl shadow-xl p-8 md:p-10 text-center animate-scale-in border border-gray-100">
        
        <!-- Animated Icon Container -->
        <div class="relative w-24 h-24 mx-auto mb-6 animate-float">
            <!-- Background glow -->
            <div class="absolute inset-0 bg-indigo-100 rounded-full scale-110 opacity-50"></div>
            <!-- Solid circle -->
            <div class="relative w-full h-full bg-indigo-50 text-indigo-600 rounded-full flex items-center justify-center border-4 border-white shadow-sm">
                <svg class="w-12 h-12 text-indigo-600" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path class="checkmark-draw" stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path>
                </svg>
            </div>
        </div>

        <!-- Typography -->
        <h1 class="text-3xl font-bold text-gray-800 mb-3 tracking-tight">Thank You!</h1>
        <p class="text-gray-600 mb-8 leading-relaxed">
            Your message has been successfully sent. I appreciate you taking the time to reach out, and I will get back to you as soon as possible.
        </p>

        <!-- Return Button -->
        <a href="index.html" class="group relative inline-flex items-center justify-center w-full px-6 py-3.5 text-base font-medium text-white bg-[#5B4CFF] rounded-lg overflow-hidden transition-all duration-300 hover:bg-indigo-700 hover:shadow-lg hover:shadow-indigo-500/30 active:scale-[0.98] focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2">
            <span class="absolute right-0 w-8 h-32 -mt-12 transition-all duration-1000 transform translate-x-12 bg-white opacity-10 rotate-12 group-hover:-translate-x-96 ease"></span>
            <i class="fas fa-arrow-left mr-2 group-hover:-translate-x-1 transition-transform duration-300"></i>
            Return to Homepage
        </a>
        
    </div>

</body>
</html>
